<!doctype html>
<html lang="en-IN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#142f68">
  <title>Thank You | EduUnite BBA Abroad</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 15% 15%, rgba(255, 216, 77, .28), transparent 34%), linear-gradient(135deg, #f4f8ff, #fff8ef);
      padding: 24px
    }

    .thanks {
      width: min(100%, 680px);
      padding: 54px 42px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center
    }

    .thanks__icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #dff7ec;
      color: var(--green);
      font-size: 34px;
      font-weight: 900
    }

    .thanks h1 {
      font-size: clamp(34px, 7vw, 54px);
      margin-bottom: 14px
    }

    .thanks p {
      color: var(--muted);
      max-width: 530px;
      margin: 0 auto 24px
    }

    .thanks__actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap
    }

    .thanks small {
      display: block;
      margin-top: 20px;
      color: var(--muted)
    }
  </style>
</head>

<body>
  <main class="thanks">
    <img src="assets/images/logo.svg" width="176" height="46" alt="EduUnite" style="margin:0 auto 28px">
    <div class="thanks__icon">✓</div>
    <h1>Thank You!</h1>
    <p>Your BBA abroad enquiry has been received. An EduUnite counsellor will connect with you to understand your
      profile, preferred destination and budget.</p>
    <div class="thanks__actions">
      <a class="button button--primary button--large" href="tel:+919355907407">Talk to an Expert</a>
      <a class="button button--outline button--large"
        href="https://wa.me/919355907407?text=Hi%2C%20I%20submitted%20the%20BBA%20abroad%20form." rel="nofollow">Chat on
        WhatsApp</a>
      <a class="button button--outline button--large" href="index.html">Back to BBA Page</a>
    </div>
    <small>Keep your Class 10/12 academic details ready for a faster profile evaluation.</small>
  </main>
  <script>
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'bba_abroad_thank_you_page' });
  </script>
</body>

</html>
