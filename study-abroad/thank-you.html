  <meta charset="utf-8">

  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#142f68">
  <title>Thank You | EduUnite BBA Abroad</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 15% 15%, rgba(255, 216, 77, .28), transparent 34%), linear-gradient(135deg, #f4f8ff, #fff8ef);
      padding: 24px
    }

    .thanks {
      width: min(100%, 680px);
      padding: 54px 42px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center
    }

    .thanks__icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #dff7ec;
      color: var(--green);
      font-size: 34px;
      font-weight: 900
    }

    .thanks h1 {
      font-size: clamp(34px, 7vw, 54px);
      margin-bottom: 14px
    }

    .thanks p {
      color: var(--muted);
      max-width: 530px;
      margin: 0 auto 24px
    }

    .thanks__actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap
    }

    .thanks small {
      display: block;
      margin-top: 20px;
      color: var(--muted)
    }
  </style>
